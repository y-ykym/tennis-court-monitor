# 自宅の Raspberry Pi で予約支援サーバーを動かすための構成。
#   booking    予約支援サーバー本体(../Dockerfile。自宅回線から予約サイトへ出る → reCAPTCHA v3 で通る → 「予約」まで自動)
#              フェーズ3 の自動予約(1 分おきの空き照会 → 予約)も同じコンテナの中で動く(.env の AUTO_BOOKING で on / dry-run / off)
#   tunnel     Cloudflare Tunnel(quick tunnel)。外(スマホ)から booking に届く URL を作る。URL は起動ごとに変わる
#   registrar  tunnel の現在の URL を玄関の Worker に 4 分ごとに登録する(server/register.mjs)
#
# 使い方(この pc/ ディレクトリで):
#   cp .env.example .env   →  .env に値を書く(パスワード等。ファイルは gitignore 済み)
#   docker compose up -d --build
#   docker compose logs -f registrar   # 「登録しました: xxx.trycloudflare.com」が出れば外から届く
# コンテナのログ上限(既定は無制限で、tunnel は切断ログが多く数か月で GB 単位になる)。1 ファイル 10MB × 3 世代 = 最大 30MB/サービス
x-logging: &default-logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

services:
  booking:
    # ビルドコンテキストはリポジトリ直下(lib/ を Pi でも使うため)。除外は リポジトリ直下の .dockerignore
    build:
      context: ../..
      dockerfile: booking/Dockerfile
    image: tennis-booking:local
    restart: unless-stopped
    logging: *default-logging
    init: true               # 終わったブラウザのゾンビプロセスを回収する(node が PID 1 だと残る)
    env_file: .env
    environment:
      # 高速経路(ページ内 fetch でログイン〜枠選択。約 40 秒)。'0' にすると最初から UI 操作(人間らしいクリック・遷移。約 90 秒)。
      # 2026-09-13: v2 が頻発したとき '0' で試し、自動操作の目印(下の IGNORE_DEFAULT_ARGS)を消したうえで '1' に戻して検証中。
      # v2 が再び頻発したら '0' に
      FAST_PATH: '1'
      # 自動操作の痕跡を消す(2026-09-13)。Playwright 既定の --enable-automation は navigator.webdriver=true にし、
      # reCAPTCHA はこれを機械の印として見る(同じ回線から人が操作すると v2 は出なかった)。外すと false になる
      IGNORE_DEFAULT_ARGS: '--enable-automation'
      CHROME_ARGS: '--disable-blink-features=AutomationControlled'
      STEP_TIMEOUT_MS: '90000' # 1 ステップの待ち上限。自宅回線が遅い時間帯(深夜)に 30 秒では足りなかったため延長(2026-09-13)
      APPLY_TIMEOUT_MS: '90000'
      PROFILE_LOCAL: '1'       # ブラウザプロファイルを下の volume に持ち越す
      # フェーズ3: 空き照会(lib/scrape.js)の失敗時レスポンスはコンテナ内に溜めない(1 分周期で増えるため)
      SCRAPE_DEBUG_DIR: ''
      AUTO_STATE_FILE: /var/lib/booking/auto-state.json
      SCREEN_W: '600'
      SCREEN_H: '1000'
    volumes:
      - profile:/tmp/profile
      - state:/var/lib/booking # 回線断で送れなかった LINE カードの持ち越し(src/line-queue.js)と自動予約の状態(src/auto-state.js)
    ports:
      - '127.0.0.1:8080:8080' # PC 自身からの確認用(http://localhost:8080/warmup)。外からは tunnel 経由
    shm_size: 1g

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging: *default-logging
    # --protocol http2: 既定の QUIC(UDP)は家庭用回線(SoftBank Air 等)で不安定なことがあるため、TCP の http2 で張る
    command: tunnel --no-autoupdate --protocol http2 --metrics 0.0.0.0:2000 --url http://booking:8080
    ports:
      - '127.0.0.1:2000:2000' # metrics(/ready, /quicktunnel)。tunnel-watchdog.sh と pi-check.sh が Pi 自身から見る
    depends_on:
      - booking

  registrar:
    image: tennis-booking:local
    restart: unless-stopped
    logging: *default-logging
    command: node server/register.mjs
    env_file: .env
    environment:
      TUNNEL_METRICS_URL: http://tunnel:2000
    depends_on:
      - tunnel

volumes:
  profile:
  state:
