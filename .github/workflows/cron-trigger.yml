# monitor.yml 本体のschedule(cron)が発火しない問題の切り分け用リレー。
# 新しいワークフロー=新しいcron登録として、5分おきに monitor.yml をdispatchする。
# monitor.yml 自身のscheduleが動き出したら、二重実行になるためこのファイルは削除すること。
name: cron-trigger
on:
  schedule:
    - cron: '*/5 * * * *' # 切り分けのため最も単純な記法にしている
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: monitor.yml を起動
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --repo ${{ github.repository }}
