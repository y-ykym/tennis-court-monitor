name: reserve

# フェーズ2 予約実行。LINE の「予約する」ボタン → Cloudflare Worker → repository_dispatch(event_type: reserve)で起動する。
# 手動テスト用に workflow_dispatch もある(dry_run=true なら予約内容確認画面までで止まり、LINE 通知もしない)。
#
# client_payload の形(Worker が送る):
#   { "park": "1050", "date": "2026-09-17", "startHour": 15, "people": 2, "person": "A" }
#
# 必要な Secrets(Settings → Secrets and variables → Actions):
#   SITE_USER_A / SITE_PASS_A / LABEL_A   Aの利用者番号・パスワード・呼び名(Cloudflare の Worker Secrets と同じ値)
#   SITE_USER_B / SITE_PASS_B / LABEL_B   Bの同上
#   LINE_CHANNEL_ACCESS_TOKEN / LINE_USER_ID  フェーズ1と共通(既に登録済み)
on:
  repository_dispatch:
    types: [reserve]
  workflow_dispatch:
    inputs:
      park:
        description: 公園コード(猿江=1040 / 亀戸=1050 / 大島小松川=1160)
        required: true
        default: '1050'
      date:
        description: 利用日 YYYY-MM-DD
        required: true
      start:
        description: 開始時刻(9/11/13/15/17/19)
        required: true
        default: '15'
      people:
        description: 利用人数
        required: true
        default: '2'
      person:
        description: 予約者(A / B)
        type: choice
        default: A
        options: [A, B]
      dry_run:
        description: 予約内容確認画面までで止める(予約しない・LINE通知しない)
        type: boolean
        default: true

# 同時に2件走らせない(AとBが同じ枠を押した場合などは順番に処理する)
concurrency:
  group: reserve
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo
  PARK: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.park || inputs.park }}
  DATE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.date || inputs.date }}
  START: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.startHour || inputs.start }}
  PEOPLE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.people || inputs.people }}
  PERSON: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.person || inputs.person }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: booking
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: booking/package-lock.json

      - name: 依存パッケージをインストール
        run: npm ci

      # Chromium 本体(約150MB)は Playwright のバージョンごとにキャッシュして、毎回のダウンロード(約40秒)を省く
      - name: Playwright のバージョンを取得
        id: pw
        run: echo "version=$(node -e "console.log(require('playwright/package.json').version)")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}

      - name: Chromium をインストール
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: 予約実行
        id: reserve
        # 業務上の失敗(先に取られた等)でもワークフロー自体は成功扱いにし、結果は LINE で伝える
        continue-on-error: true
        env:
          SITE_USER: ${{ env.PERSON == 'B' && secrets.SITE_USER_B || secrets.SITE_USER_A }}
          SITE_PASS: ${{ env.PERSON == 'B' && secrets.SITE_PASS_B || secrets.SITE_PASS_A }}
        run: |
          echo "枠: 公園=$PARK 日付=$DATE 開始=$START時 人数=$PEOPLE 予約者=$PERSON dry_run=$DRY_RUN"
          node scripts/reserve-cli.mjs --park "$PARK" --date "$DATE" --start "$START" --people "$PEOPLE" \
            --out result.json --debug-dir debug-out $([ "$DRY_RUN" = "true" ] && echo --dry-run)

      - name: 結果を LINE に通知
        if: env.DRY_RUN != 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LABEL: ${{ env.PERSON == 'B' && secrets.LABEL_B || secrets.LABEL_A }}
        run: |
          if [ -f result.json ]; then
            node scripts/notify-result.mjs result.json
          else
            echo "result.json が無いため通知をスキップ(実行前に落ちた)"
          fi

      - name: 失敗時のスクリーンショット/HTML を保存(個人情報を含むため3日で消える)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reserve-debug
          path: booking/debug-out/
          if-no-files-found: ignore
          retention-days: 3
