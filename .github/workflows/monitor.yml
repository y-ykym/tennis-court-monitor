name: tennis-court-monitor

# 定期起動は cron-job.org から5分おきに workflow_dispatch API を叩いて行う。
# (GitHubのschedule(cron)がこのアカウントで極端に間引かれる問題への対応。
#  経緯と観測装置は y-ykym/cron-canary を参照。GitHub cronが正常化したら
#  scheduleトリガーを復活させ、cron-job.org側を止めて一本化する)
on:
  workflow_dispatch: # 手動実行(テスト用)/ cron-job.orgからの定期起動
    inputs:
      mode:
        description: 実行モード
        type: choice
        default: normal
        options:
          - normal # 通常実行(実サイトをチェック)
          - mock-test # モックデータでLINE送信経路をテスト(サイトアクセスなし)

# 前の実行が終わるまで次を待たせる(重複実行防止)
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write # state.json をコミットするため

env:
  TZ: Asia/Tokyo

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存パッケージをインストール
        run: npm ci

      - name: 空きチェック実行
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          # mock-test時はサイトにアクセスせず、モックデータで実際にLINEへ送信する
          MOCK_SLOTS_FILE: ${{ inputs.mode == 'mock-test' && 'test/mock-slots.json' || '' }}
        run: node check.js

      - name: 失敗時のデバッグ用レスポンスを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-responses
          path: debug/
          if-no-files-found: ignore

      - name: state.json をコミット(変化があった時のみ)
        if: inputs.mode != 'mock-test' # テスト実行の結果は保存しない
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "update state [skip ci]"
          # 実行中に人間がpushしているとリモートが進んでいて拒否されるため、
          # rebaseで取り込んでからpushする(state.jsonが競合したらこの実行の値を優先)。
          # 保存に失敗すると次回実行が同じ空きを新規と誤判定して二重通知になるので、
          # リトライしてでも必ず保存する
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "state.jsonのpushに3回失敗しました"
          exit 1
