# Cloudflare Workers の設定(フェーズ1.5 予約確認ボット)
#
# ここに Secrets(トークン・パスワード・利用者番号)は絶対に書かない。
# Secrets は `npx wrangler secret put <NAME>` で登録する(一覧は .dev.vars.example / README 参照)。
# ローカル開発(`npm run dev`)では、同じキー名を worker/.dev.vars に書くと自動で読み込まれる。

name = "tennis-reservation-bot"
main = "src/index.js"
# インストール済み workerd(1.20260831)が対応する最新日付。Node互換フラグは不要(標準fetch/Web Cryptoのみ使用)
compatibility_date = "2026-08-31"

# *.workers.dev のURLを有効にする(LINEのWebhook URLとして使う)
workers_dev = true

# `wrangler tail` に加えて、Cloudflareダッシュボードでもログを見られるようにする(無料枠あり)
[observability]
enabled = true

# フェーズ2 予約支援の玄関で使う KV(自宅 PC の現在の URL を TTL 付きで保存)。
# フェーズ3 では 除外日・除外枠(auto_exclusions)もここに置く(src/auto.js)。Pi の生存は KV に書かず、Pi の /auto/status を直接聞く
# (KV の書き込みは無料枠 1 日 1,000 回。URL 登録の 360 回/日・監視の 24 回/日と合わせて超えないようにする。
#  上限に当たると日本時間の翌朝 9 時=UTC 0 時のリセットまで書けない)。
# 初回: `npx wrangler kv namespace create BOOKING_KV` を実行し、表示された id を下に書く
[[kv_namespaces]]
binding = "BOOKING_KV"
id = "97e0d8dae665476797bae9dc168c560b"

# フェーズ1.6 予約キャンセル。"1" のとき予約一覧カードに「キャンセル」ボタンを出し、postback を受け付ける。
# "0" にして deploy すればボタンは消え、押されても無視する(既に配られたカードのボタンも無効になる)
[vars]
CANCEL_ENABLED = "1"

# cron は UTC で書く(JST = UTC+9)。同じ時刻に複数の cron が当たっても、それぞれ別々に呼ばれる
# (例: 毎月 1 日の 0:00 UTC は 3 本とも発火する)。どれが呼ばれたかは src/index.js の scheduled() が event.cron で振り分ける。
#   0 * * * *   毎時 0 分     = 自宅の予約サーバー(Pi)の生存監視(止まっていたら LINE に知らせる、復帰も)。src/monitor.js
#   0 0 1 * *   毎月 1 日 9:00 JST = 手動メンテ(ブラウザのイメージ再ビルド)のお知らせ。src/monitor.js
#   0 0 * * *   毎日 9:00 JST  = フェーズ4 ペナルティ予告アラート(今日 23:59 までにキャンセルすれば無料の予約)。src/penalty-alert.js
#   35 14 * * * 毎日 23:35 JST = 同上の最終確認(自動予約が +4 日の枠を取らなくなる時刻 = 対象がこれ以上増えない時刻)
[triggers]
crons = ["0 * * * *", "0 0 1 * *", "0 0 * * *", "35 14 * * *"]
